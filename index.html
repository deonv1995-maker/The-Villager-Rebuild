<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no" />
  <meta name="theme-color" content="#101d15" />
  <meta name="application-name" content="The Villager" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <title>The Villager — Foundation 0.3.2</title>
  <link rel="manifest" href="./manifest.webmanifest" />
  <link rel="icon" href="./icons/ranger-192.png" type="image/png" sizes="192x192" />
  <link rel="apple-touch-icon" href="./icons/ranger-192.png" />
  <link rel="stylesheet" href="./src/styles.css" />
  <script type="importmap">
    {
      "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js",
        "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.180.0/examples/jsm/"
      }
    }
  </script>
</head>
<body>
  <div id="app-shell">
    <canvas id="game-canvas" aria-label="The Villager test world"></canvas>
    <div id="boot-status">FOUNDATION 0.3.2 · STARTING</div>
  </div>
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker
          .register('./sw.js', { scope: './', updateViaCache: 'none' })
          .then(registration => registration.update())
          .catch(error => console.warn('[PWA]', error));
      }, { once: true });
    }
  </script>
  <script type="module" src="./src/main.js"></script>
</body>
</html>
