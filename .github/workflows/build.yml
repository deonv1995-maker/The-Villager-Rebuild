name: Build foundation

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund
      - run: npm run check
      - name: Verify selected production asset integrity
        shell: bash
        run: |
          set -euo pipefail
          check() {
            local path="$1"
            local expected="$2"
            test -f "$path"
            test "$(git hash-object "$path")" = "$expected"
          }

          check public/assets/kaykit/adventurers/Ranger.glb 8edaf04430036130c3a7fcb6767049aac3c3f3a7
          check public/assets/kaykit/animations/Rig_Medium_General.glb 5d16cb6815fc8371705147188813f851c10ba26a
          check public/assets/kaykit/animations/Rig_Medium_MovementBasic.glb 98e965e886ec539e80f8984a77a29b0c1c02e5e5

          check public/assets/kaykit/forest/Tree_1_A_Color1.gltf 1c453051b537f6dfab6c6b9d82531774ace25c85
          check public/assets/kaykit/forest/Tree_1_A_Color1.bin c96917f8f6b7cf59306af26d406ba36a597b888d
          check public/assets/kaykit/forest/Tree_2_A_Color1.gltf f1d34cbbc103593c8b53f2bb01e0d07edc305446
