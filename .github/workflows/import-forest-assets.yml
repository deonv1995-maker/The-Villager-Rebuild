name: Import forest production assets

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/import-forest-assets.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  import-forest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download byte-identical KayKit forest payloads
        shell: bash
        run: |
          set -euo pipefail
          base='https://assets.tkaflowarts.com/models/forest'
          out='public/assets/kaykit/forest'
          mkdir -p "$out"

          for file in \
            Tree_1_A_Color1.bin \
            Tree_2_A_Color1.bin \
            Rock_1_A_Color1.bin \
            forest_texture.png; do
            curl -L --fail --retry 3 "$base/$file" -o "$out/$file"
          done

          test "$(git hash-object "$out/Tree_1_A_Color1.gltf")" = '1c453051b537f6dfab6c6b9d82531774ace25c85'
          test "$(git hash-object "$out/Tree_1_A_Color1.bin")"  = 'c96917f8f6b7cf59306af26d406ba36a597b888d'
          test "$(git hash-object "$out/Tree_2_A_Color1.gltf")" = 'f1d34cbbc103593c8b53f2bb01e0d07edc305446'
          test "$(git hash-object "$out/Tree_2_A_Color1.bin")"  = '420b678bd60994af497c9d18abe6a64d87595936'
          test "$(git hash-object "$out/Rock_1_A_Color1.gltf")" = 'cfee4dd720002583c195f1e4f6ce35eeb984b51d'
          test "$(git hash-object "$out/Rock_1_A_Color1.bin")"  = 'df23c5d4e393fc366f992340aea4433ec7fc3c8e'
          test "$(git hash-object "$out/forest_texture.png")"  = '3674554457d00bb06e0fb481a4bb637d232a25fa'

      - name: Commit selected forest payloads
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add public/assets/kaykit/forest
          if git diff --cached --quiet; then
            echo 'Forest assets already match the selected production files.'
            exit 0
          fi
          git commit -m 'Import selected KayKit forest payloads'
          git push
