name: Ingest Foundation 0.2 assets

on:
  push:
    branches: [main]
    paths:
      - '_asset_ingest/**'

permissions:
  contents: write

jobs:
  ingest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Wait for complete payload
        id: payload
        shell: bash
        run: |
          shopt -s nullglob
          parts=(_asset_ingest/asset-0.2.part-*)
          echo "count=${#parts[@]}" >> "$GITHUB_OUTPUT"
          if [ "${#parts[@]}" -ne 8 ]; then
            echo "Foundation 0.2 payload is not complete yet (${#parts[@]}/8 parts)."
          fi
      - name: Reconstruct and commit curated assets
        if: steps.payload.outputs.count == '8'
        shell: bash
        run: |
          cat _asset_ingest/asset-0.2.part-* | base64 --decode > /tmp/villager-assets-0.2.tar.xz
          echo '5b40c506fae9d49b8bfed3bf3e240741ff5ced7da7d601dfe65512815221f52f  /tmp/villager-assets-0.2.tar.xz' | sha256sum --check --strict
          tar -xJf /tmp/villager-assets-0.2.tar.xz -C .
          rm -rf _asset_ingest
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add public/assets licenses _asset_ingest
          git commit -m 'Import curated Foundation 0.2 production assets'
          git push
