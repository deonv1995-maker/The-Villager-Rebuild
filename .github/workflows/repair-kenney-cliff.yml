name: Repair Kenney cliff import

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/repair-kenney-cliff.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  repair-cliff:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Recover selected cliff payload
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p public/assets/kenney/nature
          awk '
            /cat > \/tmp\/cliff\.b64/ { capture = 1; next }
            capture && /^EOF$/ { exit }
            capture { gsub(/^[[:space:]]+/, ""); print }
          ' .github/workflows/import-kenney-cliff-exact.yml > /tmp/cliff.b64
          test -s /tmp/cliff.b64
          base64 --decode /tmp/cliff.b64 > public/assets/kenney/nature/cliff_large_rock.glb
          python - <<'PY'
          import json
          import struct
          from pathlib import Path

          path = Path('public/assets/kenney/nature/cliff_large_rock.glb')
          data = path.read_bytes()
          magic, version, declared_length = struct.unpack_from('<4sII', data, 0)
          assert magic == b'glTF', magic
          assert version == 2, version
          assert declared_length == len(data), (declared_length, len(data))
          chunk_length, chunk_type = struct.unpack_from('<II', data, 12)
          assert chunk_type == 0x4E4F534A, hex(chunk_type)
          document = json.loads(data[20:20 + chunk_length].decode('utf-8').rstrip(' \t\r\n\x00'))
          assert document.get('meshes'), 'GLB has no meshes'
          assert document.get('scenes'), 'GLB has no scenes'
          print(f"Recovered valid GLB: {len(data)} bytes")
          PY
          echo "Recovered Git hash: $(git hash-object public/assets/kenney/nature/cliff_large_rock.glb)"
      - name: Commit recovered cliff asset
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add public/assets/kenney/nature/cliff_large_rock.glb
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m 'Import exact Kenney cliff asset'
          git push
