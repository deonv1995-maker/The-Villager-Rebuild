name: Import exact Kenney cliff asset

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/import-kenney-cliff-exact.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  import-cliff:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Decode exact selected cliff asset
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p public/assets/kenney/nature
          cat > /tmp/cliff.b64 <<'EOF'

EOF
          base64 --decode /tmp/cliff.b64 > public/assets/kenney/nature/cliff_large_rock.glb
          test "$(git hash-object public/assets/kenney/nature/cliff_large_rock.glb)" = '08117311a5440a0cc61bb8a63c3f5878f943216b'
      - name: Commit exact cliff
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add public/assets/kenney/nature/cliff_large_rock.glb
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Import exact Kenney cliff asset'
          git push
