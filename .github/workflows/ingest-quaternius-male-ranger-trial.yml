name: Finalize Quaternius male ranger trial

on:
  push:
    branches:
      - feat/quaternius-male-ranger-trial
    paths:
      - .github/workflows/ingest-quaternius-male-ranger-trial.yml

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/quaternius-male-ranger-trial
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install project dependencies
        run: npm install --no-audit --no-fund
      - name: Finalize ranger trial verification and documentation
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path

          verify = Path('scripts/verify-quaternius-peasant-presentation.mjs')
          text = verify.read_text()

          old = """const EXPECTED = Object.freeze({\n  body: Object.freeze({ path: 'public/assets/quaternius/player/male_peasant.glb', size: 653892, sha256: 'cc12edb13e556cdaf6ce9fb869bf0b081ae8538e4ab6d030ae207fe63f24ab8a' }),\n  head: Object.freeze({ path: 'public/assets/quaternius/player/male_head.glb', size: 232884, sha256: '576e31b92bc2fab0b8ca6265d880d546370c3a4b80d797858cda121958c09569' }),\n  hair: Object.freeze({ path: 'public/assets/quaternius/player/hair_simpleparted.glb', size: 71444, sha256: '41675f7fce412f50d8ebd7fe4749eae3201e2a52414fdec3104b888434f2e73c' })\n});"""
          new = """const EXPECTED = Object.freeze({\n  body: Object.freeze({ path: 'public/assets/quaternius/player/male_ranger.glb', size: 1617696, sha256: '513203b0eadc4849aeba0e24effd5dc85b0b072ddc0d0b14b6242c0ba1847eea' }),\n  head: Object.freeze({ path: 'public/assets/quaternius/player/male_head.glb', size: 232884, sha256: '576e31b92bc2fab0b8ca6265d880d546370c3a4b80d797858cda121958c09569' })\n});"""
          if old not in text:
              raise SystemExit('expected Quaternius asset block did not match')
          text = text.replace(old, new, 1)

          old = """const candidateLoader = async () => {\n  const [body, head, hair] = await Promise.all([\n    loadGlb(EXPECTED.body.path),\n    loadGlb(EXPECTED.head.path),\n    loadGlb(EXPECTED.hair.path)\n  ]);\n  return { body: body.scene, head: head.scene, hair: hair.scene };\n};"""
          new = """const candidateLoader = async () => {\n  const [body, head] = await Promise.all([\n    loadGlb(EXPECTED.body.path),\n    loadGlb(EXPECTED.head.path)\n  ]);\n  return { body: body.scene, head: head.scene };\n};"""
          if old not in text:
              raise SystemExit('candidate loader block did not match')
          text = text.replace(old, new, 1)

          replacements = {
            "assert.equal(presentation.visualRoot.userData.actualModelSource, 'quaternius-cc0-peasant-v1');": "assert.equal(presentation.visualRoot.userData.actualModelSource, 'quaternius-cc0-ranger-v1');",
            "assert.equal(presentation.visualRoot.userData.visibleBody, 'quaternius-modular-peasant');": "assert.equal(presentation.visualRoot.userData.visibleBody, 'quaternius-modular-ranger');",
            "assert.equal(presentation.quaterniusParts.size, 3, 'body, head and hair must all participate in the candidate');": "assert.equal(presentation.quaterniusParts.size, 2, 'ranger body and shared head must participate without a separate hair module');\nassert.equal(presentation.quaterniusRoot.userData.hairMode, 'hood-owned-no-separate-hair-v1');",
            "console.log(`Quaternius Peasant_Male candidate assets, 65-joint rigs, scaled presentation, expressive KayKit bind-delta retargeting, relaxed elbows, palm-centered forearm-aligned tool grip, ${movement.animations.length} movement clips, sane bounds, first-person visibility and Prisma fallback verified.`);": "console.log(`Quaternius Male_Ranger comparison candidate, shared male head, 65-joint rigs, hood-owned hair policy, scaled presentation, expressive KayKit bind-delta retargeting, relaxed elbows, palm-centered forearm-aligned tool grip, ${movement.animations.length} movement clips, sane bounds, first-person visibility and Prisma fallback verified.`);"
          }
          for old, new in replacements.items():
              if old not in text:
                  raise SystemExit(f'missing verification replacement: {old}')
              text = text.replace(old, new, 1)

          marker = """  assert.equal(skeletons[0].bones.length, 65, `${name} must keep the Quaternius universal 65-joint rig`);\n"""
          addition = marker + """  if (name === 'body') {\n    const meshNames = [];\n    gltf.scene.traverse(object => { if (object.isMesh) meshNames.push(object.name); });\n    assert.ok(meshNames.includes('Male_Ranger_Head_Hood'), 'ranger trial body must retain its authored hood mesh');\n    assert.ok(meshNames.includes('Male_Ranger_Arms_Bracer'), 'ranger trial body must retain its authored bracer silhouette');\n  }\n"""
          if marker not in text:
              raise SystemExit('skeleton marker missing')
          text = text.replace(marker, addition, 1)
          verify.write_text(text)

          appearance_check = Path('scripts/verify-character-presentation-polish.mjs')
          text = appearance_check.read_text()
          old = "assert.ok(candidate.includes(\"animationAuthority = 'kaykit-medium-rig'\"), 'Quaternius candidate must preserve KayKit animation authority');"
          new = old + "\nassert.ok(candidate.includes(\"actualModelSource = 'quaternius-cc0-ranger-v1'\"), 'authored comparison must expose the male ranger candidate explicitly');\nassert.ok(candidate.includes(\"hairMode = 'hood-owned-no-separate-hair-v1'\"), 'hooded ranger trial must not layer the separate hair mesh into the hood');"
          if old not in text:
              raise SystemExit('character polish candidate marker missing')
          appearance_check.write_text(text.replace(old, new, 1))
          PY

          cat > docs/QUATERNIUS_PLAYER_PRESENTATION.md <<'EOF'
          # Quaternius Player Presentation Trial

          ## Status

          The current phone-facing comparison uses the authored Quaternius `Male_Ranger` outfit with the shared Quaternius male head. The preceding `Male_Peasant` pass proved the authored-body approach, but device screenshots still read more like a generic villager than the game's stranded survival lead. The ranger is therefore the next controlled visual candidate.

          This remains a presentation change only. The established KayKit Ranger controller, collision, grounding, camera, movement state, animation mixer and gameplay systems remain authoritative. `RangerAppearancePresentation` still resolves through the historical `QuaterniusPeasantPresentation` class name during the comparison so gameplay-facing imports do not churn every time candidate artwork changes. The masculine Prisma implementation remains the immediate visual fallback.

          ## Why the male ranger is the next candidate

          The inspected `male_ranger.glb` is from the same CC0 Quaternius modular-character family and uses the same universal 65-joint skeleton as the peasant candidate. It therefore lets the project compare a substantially different authored silhouette without changing the retargeting architecture.

          Repository-side inspection confirmed ten skinned meshes on one 65-joint skeleton, including authored ranger bracers, belts, boots, pauldron and a hood. The required pelvis/spine/neck/head, clavicle/arm/hand/finger and thigh/calf/foot/toe joints are all present. Authored bounds are approximately 1.869 m tall before the existing presentation scale.

          The ranger body already owns `Male_Ranger_Head_Hood`, so the separate `hair_simpleparted` module is intentionally not rendered in this comparison. The shared male face/head remains a separate authored module underneath the hood. This avoids a new hair-versus-hood clipping seam and keeps the comparison focused on the outfit/body choice.

          ## Runtime assets and provenance

          Active comparison assets under `public/assets/quaternius/player/` are:

          - `male_ranger.glb` — 1,617,696 bytes — SHA-256 `513203b0eadc4849aeba0e24effd5dc85b0b072ddc0d0b14b6242c0ba1847eea`;
          - `male_head.glb` — 232,884 bytes — SHA-256 `576e31b92bc2fab0b8ca6265d880d546370c3a4b80d797858cda121958c09569`.

          The previous `male_peasant.glb` and `hair_simpleparted.glb` remain in the repository temporarily as comparison/rollback assets until one authored character is accepted on device. All are CC0 Quaternius derivatives from Modular Character Outfits - Fantasy and Universal Base Characters, with provenance pinned in `licenses/quaternius-player-candidate.md`.

          ## Animation boundary

          No second character controller or animation mixer exists. For each mapped Quaternius joint, the presentation reads the current KayKit joint rotation, calculates the delta from the captured KayKit bind rotation, applies the existing small bounded presentation gain, applies that delta to the authored Quaternius bind rotation, preserves the existing five-degree lower-arm relaxation, then restores authored local positions and scales unchanged.

          The ranger candidate deliberately keeps the same `1.08` presentation scale, retarget gains and palm/tool socket calibration as the peasant comparison. Holding those values constant means the next device test is primarily judging the character artwork and silhouette instead of mixing a body swap with another scale/animation experiment.

          ## Scale, grounding and tools

          The `Male_Ranger` authored bounds are roughly 1.869 m tall. At the unchanged uniform presentation scale of `1.08`, the rendered candidate is roughly 2.02 m tall. This remains visual only: player collision, controller dimensions, terrain grounding and traversal are unchanged. Grounding is derived from the scaled authored bounding-box minimum.

          The right-hand work-tool socket remains the existing palm-centered, forearm-aligned presentation mount. The current screenshots also show that the temporary generated work-tool models themselves are still oversized/roughly proportioned, especially the hammer. That prop-shape issue is intentionally not solved in this character-comparison pass; fitting or replacing tool props should happen after the player body is chosen so tool calibration is not repeated for discarded candidates.

          ## Failure behavior

          If the ranger body or shared head fails to load, lacks required joints, produces invalid bounds or otherwise fails validation, the presentation leaves the proven Prisma character visible. The Simple humanoid fallback remains below Prisma.

          ## Stable systems deliberately unchanged

          This comparison does not modify traversal, walk/run speed, jump/double-jump, collision, terrain, camera modes, KayKit locomotion/tool clips, tool timing, spear behavior, harvesting, construction, ecology, world generation, day/night, UI, save data or PWA/install behavior.

          ## Automated verification

          `npm run check` still includes `scripts/verify-quaternius-peasant-presentation.mjs` under its historical filename. The verification now pins the exact ranger-body bytes/hash, confirms the ranger hood and bracer meshes, validates the 65-joint universal skeleton on both active modules, confirms no separate hair module is attached, checks scale/grounding, bounded motion gain, relaxed forearms, palm-centered work-tool transfer, first-person visibility, finite animation bounds and Prisma fallback behavior.

          ## Device verification required after deployment

          On a physical phone, compare the ranger candidate against the screenshots from the male-peasant pass at the same normal gameplay distance. Check front, side and rear idle plus walk/run. In particular judge overall silhouette, shoulders/arms, hood/head fit, face readability, boots/legs, door scale and how well the outfit belongs beside Sprout and the cabin. Do not use the current hammer head as the deciding factor for the character; its prop proportions are a separate presentation task. If this ranger reads better, the next pass can promote/rename the generic Quaternius seam and then calibrate the work-tool models once against the chosen body.
          EOF

          cat > licenses/quaternius-player-candidate.md <<'EOF'
          # Quaternius player candidate assets

          Active comparison files:
          - `public/assets/quaternius/player/male_ranger.glb`
          - `public/assets/quaternius/player/male_head.glb`

          Retained comparison/rollback files while the player body is being chosen:
          - `public/assets/quaternius/player/male_peasant.glb`
          - `public/assets/quaternius/player/hair_simpleparted.glb`

          Original asset authorship: Quaternius.
          Source packs: Modular Character Outfits - Fantasy and Universal Base Characters.
          License: Creative Commons Zero v1.0 Universal (CC0-1.0).

          These runtime GLBs are optimized web derivatives produced from the same CC0 Quaternius packs by the public Genesara character prep pipeline. They are pinned here to Genesara commit `90c166baa14682eedf1358c6c0a6e40e91765495`; the original Quaternius packs remain the authoritative art source and license source.

          `male_ranger.glb` was re-inspected before activation: 1,617,696 bytes, SHA-256 `513203b0eadc4849aeba0e24effd5dc85b0b072ddc0d0b14b6242c0ba1847eea`, ten skinned meshes, one 65-joint universal skeleton. Its authored hood is part of the body asset, so the separate hair module is intentionally inactive for this comparison.

          Official sources:
          - https://quaternius.com/packs/modularcharacteroutfitsfantasy.html
          - https://quaternius.itch.io/modular-character-outfits-fantasy
          - https://quaternius.itch.io/universal-base-characters
          EOF

          rm -f docs/QUATERNIUS_MALE_RANGER_INSPECTION.txt
          git rm .github/workflows/ingest-quaternius-male-ranger-trial.yml

      - name: Run complete repository checks
        run: npm run check
      - name: Commit finalized ranger comparison
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Finalize Quaternius male ranger comparison'
          git push origin HEAD:feat/quaternius-male-ranger-trial
