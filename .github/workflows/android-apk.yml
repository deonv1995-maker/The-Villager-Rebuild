name: Build Android debug APK

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android-debug:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Install web dependencies
        run: npm install --no-audit --no-fund

      - name: Verify and build web runtime
        run: npm run check

      - name: Install pinned Capacitor Android toolchain
        run: npm install --no-save --no-package-lock @capacitor/core@8.5.0 @capacitor/cli@8.5.0 @capacitor/android@8.5.0

      - name: Generate Android project
        run: npx cap add android

      - name: Sync built game into Android
        run: npx cap sync android

      - name: Apply Villager Android shell settings
        run: node scripts/prepare-android.mjs

      - name: Build installable debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew :app:assembleDebug --no-daemon

      - name: Stage APK artifact
        shell: bash
        run: |
          set -euo pipefail
          VERSION="$(node -p "require('./package.json').version")"
          mkdir -p artifacts
          cp android/app/build/outputs/apk/debug/app-debug.apk "artifacts/The-Villager-Foundation-${VERSION}-debug.apk"
          sha256sum "artifacts/The-Villager-Foundation-${VERSION}-debug.apk" > "artifacts/The-Villager-Foundation-${VERSION}-debug.apk.sha256"
          ls -lh artifacts

      - name: Upload Android APK
        uses: actions/upload-artifact@v4
        with:
          name: the-villager-android-debug-${{ github.sha }}
          path: artifacts/
          if-no-files-found: error
          compression-level: 0
          retention-days: 30
